name: Docker Image CI

on:
  push:
    branches: [ main ]
    paths:
      - 'tutorial06/randomquotes/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tutorial06/randomquotes/**'
      - '.github/workflows/docker-image.yml'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: docker login
      env:
        DOCKER_USER: ${{secrets.DOCKERHUB_USER}}
        DOCKER_PASS: ${{secrets.DOCKERHUB_PASS}}
      run: |
        echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    - name: Build the Docker image
      run: docker build tutorial06/randomquotes --file tutorial06/randomquotes/Dockerfile --tag ${{secrets.DOCKERHUB_USER}}/randomquotes:latest

    - name: Docker Push
      run: docker push ${{secrets.DOCKERHUB_USER}}/randomquotes:latest
